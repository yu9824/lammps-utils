# - https://enu23456.hatenablog.com/entry/2022/11/24/195744
name: CI
run-name: ${{ github.workflow }} (${{ github.ref_name }})

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '**/*.py'
      - 'tests/**'
      - 'packages/**'
      - '.github/workflows/CI.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'requirements*.txt'
      - 'tox.ini'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - '**/*.py'
      - 'tests/**'
      - 'packages/**'
      - '.github/workflows/CI.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'requirements*.txt'
      - 'tox.ini'

jobs:
  test:
    runs-on: ubuntu-latest
    # runs-on: ubuntu-22.04
    env:
      CONDA_ENV_NAME: test
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
      # max-parallel: 6

    steps:
    - uses: actions/checkout@v4
    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v2
      with:
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        auto-activate-base: false
        channels: conda-forge
        activate-environment: test  # env name
    - name: Install conda optional dependencies
      run: |
        conda install -n ${{ env.CONDA_ENV_NAME }} -c conda-forge -y --file requirements-conda-optional.txt
    - name: Install dependencies
      run: |
        conda run -n ${{ env.CONDA_ENV_NAME }} pip install ".[test,optional]"
    - name: Test with pytest
      run: |
        conda run -n ${{ env.CONDA_ENV_NAME }} pytest -xs .
