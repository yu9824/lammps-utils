# - https://enu23456.hatenablog.com/entry/2022/11/24/195744
name: CI
run-name: ${{ github.workflow }} (${{ github.ref_name }})

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '**/*.py'
      - 'tests/**'
      - 'packages/**'
      - '.github/workflows/CI.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'requirements*.txt'
      - 'tox.ini'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/**'
      - '**/*.py'
      - 'tests/**'
      - 'packages/**'
      - '.github/workflows/CI.yml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'setup.cfg'
      - 'requirements*.txt'
      - 'tox.ini'

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        pip install ".[test,optional]"
    - name: Test with pytest
      run: |
        pytest -xs . --ignore=tests/test_make_lammps_input.py

  test-make-lammps-input:
    runs-on: ubuntu-latest
    env:
      CONDA_ENV_NAME: test
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Miniforge
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        python-version: ${{ matrix.python-version }}
        auto-activate-base: false
        channels: conda-forge
        activate-environment: ${{ env.CONDA_ENV_NAME }}  # env name
        environment-file: conda-optional.yml
    - name: Install dependencies
      run: |
        conda run -n ${{ env.CONDA_ENV_NAME }} python3 -m pip install ".[test,optional]"
    - name: Test with pytest
      run: |
        conda run -n ${{ env.CONDA_ENV_NAME }} python3 -m pytest -xs tests/test_make_lammps_input.py
    - name: Run lammps
      run: |
        conda run -n ${{ env.CONDA_ENV_NAME }} lmp -i run.in.EXAMPLE
